<script type="module">
import * as THREE from 'three';
const TL = await (await fetch('timeline.json')).json();
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();

const hemi=new THREE.HemisphereLight(0xcfd8e6,0x4a3a26,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2b8,2.6);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:200});sun.shadow.bias=-0.0006;

// ---------- deterministic noise ----------
const hash=(n)=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const ease=(x)=>x<0?0:x>1?1:x*x*(3-2*x);
const easeOut=(x)=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const lerp=(a,b,k)=>a+(b-a)*k;
const clamp01=x=>Math.min(1,Math.max(0,x));
// closed-form spring (critically damped-ish overshoot)
const spring=(x)=>x<=0?0:1-Math.exp(-6*x)*Math.cos(9*x);

// ---------- textures ----------
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);t.anisotropy=8;return t}
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const woodTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#d4a571';g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.strokeStyle=`rgba(120,70,30,${0.05+rnd()*0.12})`;g.lineWidth=1+rnd()*3;g.beginPath();const x=rnd()*w;g.moveTo(x,0);for(let y=0;y<=h;y+=16)g.lineTo(x+Math.sin(y*0.05+i)*6,y);g.stroke()}});
const grassTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#5f7a3a';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const v=rnd();g.fillStyle=v<.5?`rgba(40,60,20,${.15+rnd()*.2})`:v<.85?`rgba(140,160,80,${.1+rnd()*.15})`:`rgba(90,70,40,${.2+rnd()*.3})`;g.fillRect(rnd()*w,rnd()*h,1+rnd()*3,2+rnd()*5)}for(let i=0;i<22;i++){g.fillStyle=`rgba(85,62,38,${.25+rnd()*.3})`;g.beginPath();g.ellipse(rnd()*w,rnd()*h,10+rnd()*40,6+rnd()*20,rnd()*3,0,7);g.fill()}},26);
// grain overlay
const gc=document.getElementById('grain').getContext('2d');
function grain(f){const id=gc.createImageData(540,960);let s=(f*9301+49297)%233280||1;for(let i=0;i<id.data.length;i+=4){s=(s*16807)%2147483647;const v=(s&255);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gc.putImageData(id,0,0)}

// ---------- materials ----------
const M={
 wood:new THREE.MeshStandardMaterial({map:woodTex,roughness:.55,metalness:0}),
 joint:new THREE.MeshStandardMaterial({color:0x7a4a26,roughness:.4}),
 dyed:new THREE.MeshStandardMaterial({map:woodTex,roughness:.6}),   // tinted per instance
 hat:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7}),

};
// ---------- terrain ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600,160,160),new THREE.MeshStandardMaterial({map:grassTex,roughness:.95}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const hgt=(x,z)=>1.6*Math.sin(x*0.035)*Math.cos(z*0.03)+0.8*Math.sin(z*0.07+1)+ (z<-10? (Math.min(1,(-10-z)/25))*3:0) + (z>14? Math.min(1,(z-14)/25)*2.2:0);
{const p=ground.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,hgt(x,-y))}ground.geometry.computeVertexNormals()}
const sea=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshStandardMaterial({color:0x1d3346,roughness:.25,metalness:.2}));
sea.rotation.x=-Math.PI/2;sea.position.y=0.2;scene.add(sea);
const island=new THREE.Mesh(new THREE.CylinderGeometry(2.2,5,3,9,1),new THREE.MeshStandardMaterial({color:0x5b5a4a,roughness:1,flatShading:true}));
island.castShadow=island.receiveShadow=true;scene.add(island);
// farmhouse (La Haye Sainte / Hougoumont style)
const farm=new THREE.Group();{
 const wall=new THREE.MeshStandardMaterial({color:0xd9cdb5,roughness:.9}),roof=new THREE.MeshStandardMaterial({color:0x8a3b2a,roughness:.8});
 const add=(w,h,d,x,z,ry=0)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wall);b.position.set(x,h/2,z);b.rotation.y=ry;b.castShadow=b.receiveShadow=true;farm.add(b);
  const r=new THREE.Mesh(new THREE.CylinderGeometry(0,Math.max(w,d)*0.62,2.2,4,1),roof);r.position.set(x,h+1.1,z);r.rotation.y=ry+Math.PI/4;r.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));r.castShadow=true;farm.add(r)};
 add(9,4,4,0,0);add(4,3.4,8,-6,3);add(7,3,3.5,1,7);}
scene.add(farm);
// trees
const treeMat=new THREE.MeshStandardMaterial({color:0x3f5a2a,roughness:1,flatShading:true});
const trees=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.4,0),treeMat,160);trees.castShadow=true;
{const m=new THREE.Matrix4(),q=new THREE.Quaternion();for(let i=0;i<160;i++){const a=hash(i)*Math.PI*2,r=55+hash(i+9)*90;const x=Math.cos(a)*r,z=Math.sin(a)*r;m.compose(new THREE.Vector3(x,hgt(x,z)+2.6,z),q,new THREE.Vector3(1,1.3+hash(i+3),1));trees.setMatrixAt(i,m)}}
scene.add(trees);

// ---------- instanced mannequin rig ----------
const MAXF=420;
const G={
 sphere:new THREE.SphereGeometry(1,20,14),
 cap:(r,l)=>new THREE.CapsuleGeometry(r,l,6,12),
};
const parts={}; // name -> {mesh, nodes:[]}
function part(name,geo,mat,mult,colored){const m=new THREE.InstancedMesh(geo,mat,MAXF*mult);m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;if(colored)m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAXF*mult*3).fill(1),3);scene.add(m);parts[name]={mesh:m,n:0};return m}
part('pelvis',G.sphere,M.wood,1);part('chest',G.sphere,M.dyed,1,true);part('neck',new THREE.CylinderGeometry(.05,.06,.14,10),M.wood,1);
part('head',G.sphere,M.wood,1);part('uarm',G.cap(.055,.24),M.dyed,2,true);part('farm',G.cap(.045,.22),M.wood,2);
part('hand',G.sphere,M.wood,2);part('thigh',G.cap(.075,.34),M.dyed,2,true);part('shin',G.cap(.06,.34),M.wood,2);
part('foot',new THREE.BoxGeometry(.1,.07,.24),M.joint,2);part('joint',G.sphere,M.joint,9);
part('musket',new THREE.CylinderGeometry(.018,.022,1.4,6),M.metal,1);
part('bicorne',(()=>{const g=new THREE.CylinderGeometry(.2,.2,.08,24,1,false,0,Math.PI);g.rotateX(Math.PI/2);g.rotateZ(Math.PI/2);g.scale(1.25,1.1,.5);return g})(),M.hat,1,true);
part('shako',new THREE.CylinderGeometry(.11,.095,.2,16),M.hat,1,true);
part('bearskin',new THREE.CylinderGeometry(.12,.105,.36,14),M.hat,1,true);
part('bicorneW',(()=>{const g=new THREE.CylinderGeometry(.2,.2,.07,24,1,false,0,Math.PI);g.rotateX(Math.PI/2);g.rotateZ(Math.PI/2);g.rotateY(Math.PI/2);g.scale(.6,1,1.15);return g})(),M.hat,1,true);
part('cap',new THREE.CylinderGeometry(.12,.11,.09,16),M.hat,1,true);
// horse
part('hbody',G.sphere,M.wood,1);part('hneck',G.cap(.16,.6),M.wood,1);part('hhead',G.cap(.12,.42),M.wood,1);
part('hleg',G.cap(.06,.75),M.wood,4);part('hjoint',G.sphere,M.joint,4);part('htail',G.cap(.05,.5),M.joint,1);

// rig hierarchy (template nodes; we pose then copy world matrices)
const O=()=>new THREE.Object3D();
const R={root:O(),hips:O(),spine:O(),chest:O(),neck:O(),head:O(),hat:O(),musket:O(),sh:[O(),O()],el:[O(),O()],hand:[O(),O()],hip:[O(),O()],kn:[O(),O()],ank:[O(),O()],
 pelvisM:O(),chestM:O(),neckM:O(),headM:O(),uaM:[O(),O()],faM:[O(),O()],handM:[O(),O()],thM:[O(),O()],shM:[O(),O()],footM:[O(),O()]};
R.root.add(R.hips);R.hips.position.y=1.0;R.hips.add(R.pelvisM);R.pelvisM.scale.set(.17,.12,.12);
R.hips.add(R.spine);R.spine.add(R.chest);R.chest.position.y=.32;R.chest.add(R.chestM);R.chestM.scale.set(.2,.27,.13);R.chestM.position.y=.02;
R.chest.add(R.neck);R.neck.position.y=.3;R.neck.add(R.neckM);R.neckM.position.y=.04;R.neck.add(R.head);R.head.position.y=.17;R.head.add(R.headM);R.headM.scale.set(.1,.13,.11);
R.head.add(R.hat);R.hat.position.y=.13;R.chest.add(R.musket);
for(const s of [0,1]){const sg=s?1:-1;
 R.chest.add(R.sh[s]);R.sh[s].position.set(.23*sg,.2,0);R.sh[s].add(R.uaM[s]);R.uaM[s].position.y=-.16;
 R.sh[s].add(R.el[s]);R.el[s].position.y=-.32;R.el[s].add(R.faM[s]);R.faM[s].position.y=-.15;R.el[s].add(R.hand[s]);R.hand[s].position.y=-.31;R.hand[s].add(R.handM[s]);R.handM[s].scale.setScalar(.055);
 R.hips.add(R.hip[s]);R.hip[s].position.set(.1*sg,-.06,0);R.hip[s].add(R.thM[s]);R.thM[s].position.y=-.22;
 R.hip[s].add(R.kn[s]);R.kn[s].position.y=-.45;R.kn[s].add(R.shM[s]);R.shM[s].position.y=-.22;R.kn[s].add(R.ank[s]);R.ank[s].position.y=-.47;R.ank[s].add(R.footM[s]);R.footM[s].position.set(0,-.01,.05);}
const HR={root:O(),body:O(),bodyM:O(),neck:O(),neckM:O(),head:O(),headM:O(),tail:O(),legs:[O(),O(),O(),O()],legM:[O(),O(),O(),O()],saddle:O()};
HR.root.add(HR.body);HR.body.position.y=1.35;HR.body.add(HR.bodyM);HR.bodyM.scale.set(.32,.36,.85);
HR.body.add(HR.neck);HR.neck.position.set(0,.2,.7);HR.neck.rotation.x=.75;HR.neck.add(HR.neckM);HR.neckM.position.y=.35;
HR.neck.add(HR.head);HR.head.position.y=.72;HR.head.rotation.x=1.25;HR.head.add(HR.headM);HR.headM.position.y=.2;
HR.body.add(HR.tail);HR.tail.position.set(0,.15,-.82);HR.tail.rotation.x=-2.5;HR.body.add(HR.saddle);HR.saddle.position.y=.38;
[[.18,.55],[-.18,.55],[.18,-.6],[-.18,-.6]].forEach(([x,z],i)=>{HR.body.add(HR.legs[i]);HR.legs[i].position.set(x,-.15,z);HR.legs[i].add(HR.legM[i]);HR.legM[i].position.y=-.52});

const TEAM={fr:new THREE.Color(0x2c4a9a),gb:new THREE.Color(0xb8322c),pr:new THREE.Color(0x2b2d33),nap:new THREE.Color(0x3b4a6b),wood:new THREE.Color(0xffffff),guard:new THREE.Color(0x1f2f6e)};
const HATC={black:new THREE.Color(0x1a1a1a),fur:new THREE.Color(0x15110e),gb:new THREE.Color(0x222222)};
const tmpM=new THREE.Matrix4(),tmpS=new THREE.Matrix4();
function put(name,obj,color,scale){const p=parts[name];if(p.n>=p.mesh.count&&p.n>=MAXF*99)return;obj.updateWorldMatrix(true,false);tmpM.copy(obj.matrixWorld);if(scale)tmpM.multiply(tmpS.makeScale(scale[0],scale[1],scale[2]));p.mesh.setMatrixAt(p.n,tmpM);if(color&&p.mesh.instanceColor)p.mesh.setColorAt(p.n,color);p.n++}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
// pose: {x,z,ry,y, walk:phase, amp, aim, musket:'shoulder'|'aim'|'port'|null, lean, headP, headY, armUp:[l,r], hat, team, sit, s, wave}
function figure(p){
 const s=p.s||1;R.root.position.set(p.x,(p.y!==undefined?p.y:hgt(p.x,p.z)),p.z);R.root.rotation.set(0,p.ry||0,p.roll||0);R.root.scale.setScalar(s);
 const ph=p.walk,amp=p.amp??0.5;const sw=ph===undefined?0:Math.sin(ph);
 R.hips.position.y=1.0+(ph===undefined?0:Math.abs(Math.cos(ph))*0.04*amp*2)-(p.kneel?0.42:0);
 R.spine.rotation.set(p.lean||0,0,0);R.neck.rotation.set(0,0,0);R.head.rotation.set(p.headP||0,p.headY||0,0);
 for(const sd of [0,1]){const sg=sd?1:-1;const leg=sd?sw:-sw;
  if(p.sit){R.hip[sd].rotation.set(-1.45,0,-.35*sg);R.kn[sd].rotation.set(1.5,0,0)}
  else if(p.kneel&&sd===0){R.hip[sd].rotation.set(-1.4,0,0);R.kn[sd].rotation.set(1.45,0,0)}
  else if(p.kneel){R.hip[sd].rotation.set(.1,0,0);R.kn[sd].rotation.set(1.6,0,0)}
  else{R.hip[sd].rotation.set(-leg*amp,0,.03*sg);R.kn[sd].rotation.set(Math.max(0,leg)*amp*1.3,0,0)}
  R.ank[sd].rotation.set(0,0,0);
  const up=(p.armUp&&p.armUp[sd])||0;
  R.sh[sd].rotation.set(leg*amp*0.8*(p.musket&&sd?0.2:1)-up*2.6,0,sg*(0.12+up*0.25));R.el[sd].rotation.set(-0.25-up*0.2,0,0);}
 // musket poses
 const mk=p.musket;R.musket.visible=!!mk;
 if(mk==='shoulder'){R.sh[1].rotation.set(-0.15,0,.1);R.el[1].rotation.set(-1.7,0,0);R.musket.position.set(.27,.25,.08);R.musket.rotation.set(0,0,0);}
 if(mk==='port'){R.sh[1].rotation.set(-0.5,0,.1);R.el[1].rotation.set(-1.2,0,-.6);R.sh[0].rotation.set(-0.7,0,-.1);R.el[0].rotation.set(-1.3,0,.7);R.musket.position.set(0,.05,.25);R.musket.rotation.set(0,0,0.9);}
 if(mk==='aim'){R.sh[1].rotation.set(-1.4,0,-.1);R.el[1].rotation.set(-.5,0,0);R.sh[0].rotation.set(-1.45,0,.55);R.el[0].rotation.set(-.15,0,0);R.musket.position.set(.03,.32,.55);R.musket.rotation.set(Math.PI/2,0,0);R.head.rotation.set(.12,0.25,0);}
 const c=TEAM[p.team||'wood'];
 put('pelvis',R.pelvisM);put('chest',R.chestM,c);put('neck',R.neckM);put('head',R.headM);
 for(const sd of [0,1]){put('uarm',R.uaM[sd],c);put('farm',R.faM[sd]);put('hand',R.handM[sd]);put('thigh',R.thM[sd],p.team==='gb'||p.team==='nap'?TEAM.wood:c);put('shin',R.shM[sd]);put('foot',R.footM[sd]);
  for(const j of [R.sh[sd],R.el[sd],R.hip[sd],R.kn[sd]])put('joint',j,null,[.07,.07,.07]);}
 put('joint',R.neck,null,[.06,.06,.06]);
 if(mk)put('musket',R.musket);
 if(p.hat){const hc={bicorne:HATC.black,shako:p.team==='gb'?HATC.gb:HATC.black,bearskin:HATC.fur,bicorneW:HATC.black,cap:new THREE.Color(0x1d1e22)}[p.hat];
  const off={bicorne:.02,shako:.08,bearskin:.15,bicorneW:.03,cap:.02}[p.hat];R.hat.position.y=.1+off;put(p.hat,R.hat,hc);}
}
function horse(h){
 HR.root.position.set(h.x,hgt(h.x,h.z),h.z);HR.root.rotation.set(0,h.ry||0,0);
 const ph=h.gallop;const g=ph===undefined?0:1;
 HR.body.position.y=1.35+(g?Math.sin(ph*2)*0.08:0);HR.body.rotation.x=g?Math.sin(ph)*0.08:0;
 HR.neck.rotation.x=.75+(g?Math.sin(ph+1)*0.12:0)-(h.rear||0);HR.body.rotation.x-=(h.rear||0)*0.6;
 HR.legs.forEach((l,i)=>{l.rotation.x=g?Math.sin(ph+(i<2?0:Math.PI)+(i%2?0.5:0))*0.7:0});
 put('hbody',HR.bodyM);put('hneck',HR.neckM);put('hhead',HR.headM);put('htail',HR.tail,null,[1,1,1]);
 HR.legs.forEach((l,i)=>{put('hleg',HR.legM[i]);put('hjoint',l,null,[.1,.1,.1])});
 if(h.rider){HR.saddle.updateWorldMatrix(true,false);const wp=new THREE.Vector3().setFromMatrixPosition(HR.saddle.matrixWorld);
  figure({x:wp.x,y:wp.y-1.0+0.08,z:wp.z,ry:h.ry,sit:true,team:h.team,hat:h.hat,armUp:h.sabre?[0,0.6+Math.sin((ph||0)*2)*0.2]:[0,0],lean:h.lean??0.15});}
}
function beginFrame(){for(const k in parts)parts[k].n=0}
function endFrame(){for(const k in parts){const p=parts[k];p.mesh.count=p.n;p.mesh.instanceMatrix.needsUpdate=true;if(p.mesh.instanceColor)p.mesh.instanceColor.needsUpdate=true}}

// ---------- smoke & flashes ----------
const smokeBuckets=[.75,.5,.3,.15].map(o=>{const m=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),new THREE.MeshStandardMaterial({color:0xe9e5dc,transparent:true,opacity:o,roughness:1,depthWrite:false}),400);m.frustumCulled=false;scene.add(m);return m});
const flash=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),new THREE.MeshBasicMaterial({color:0xffd27a}),200);flash.frustumCulled=false;scene.add(flash);
let smokeList=[],flashList=[];
function puff(x,y,z,age,size=1){smokeList.push([x,y,z,age,size])}
function flushSmoke(){const cnt=[0,0,0,0];const m=new THREE.Matrix4(),q=new THREE.Quaternion();
 for(const [x,y,z,age,sz] of smokeList){if(age<0||age>4)continue;const b=Math.min(3,Math.floor(age/1.0));const r=sz*(0.4+age*0.55);const mesh=smokeBuckets[b];
  m.compose(V(x+age*0.4,y+age*0.5,z),q,V(r,r*0.8,r));mesh.setMatrixAt(cnt[b]++,m)}
 smokeBuckets.forEach((mb,i)=>{mb.count=cnt[i];mb.instanceMatrix.needsUpdate=true});
 let n=0;for(const [x,y,z,s] of flashList){m.compose(V(x,y,z),q,V(s,s,s));flash.setMatrixAt(n++,m)}flash.count=n;flash.instanceMatrix.needsUpdate=true;smokeList=[];flashList=[]}
// rain
const RAINN=2600;const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(RAINN*6),3));
const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0xaab8c8,transparent:true,opacity:.55}));rain.frustumCulled=false;scene.add(rain);
function setRain(t,on,cx,cz){rain.visible=on;if(!on)return;const a=rainGeo.attributes.position.array;for(let i=0;i<RAINN;i++){const x=cx+(hash(i)-.5)*40,z=cz+(hash(i+.5)-.5)*40;const y=((hash(i+.3)*14-t*18)%14+14)%14;a.set([x,y,z,x+.05,y+.6,z],i*6)}rainGeo.attributes.position.needsUpdate=true}

// ---------- overlay helpers ----------
const $=id=>document.getElementById(id);
function setText(id,txt,op,ty=0,sc=1){const e=$(id);if(e._t!==txt){e.innerHTML=txt;e._t=txt}e.style.opacity=op;e.style.transform=`translateY(${ty}px) scale(${sc})`}
const labelsEl=$('labels');
function labels(list){labelsEl.innerHTML='';for(const l of list){if(l.op<=0)continue;const v=V(...l.p).project(cam);const d=document.createElement('div');d.className='lab';d.style.setProperty('--c',l.c);d.textContent=l.t;d.style.left=((v.x+1)/2*W)+'px';d.style.top=((1-v.y)/2*H)+'px';d.style.opacity=l.op;d.style.transform=`translate(-50%,-100%) scale(${0.7+0.3*spring(l.op)})`;labelsEl.appendChild(d)}}
const arrowEl=$('arrow');
function arrow(pts,k,color){if(k<=0){arrowEl.innerHTML='';return}const P=pts.map(p=>{const v=V(...p).project(cam);return[(v.x+1)/2*W,(1-v.y)/2*H]});
 let d=`M${P[0][0]},${P[0][1]}`;for(let i=1;i<P.length;i++)d+=` L${P[i][0]},${P[i][1]}`;
 const last=P[P.length-1],prev=P[P.length-2];const ang=Math.atan2(last[1]-prev[1],last[0]-prev[0]);
 arrowEl.innerHTML=`<path d="${d}" stroke="${color}" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-k}" opacity=".9"/>`+(k>0.97?`<polygon points="0,-40 70,0 0,40" fill="${color}" transform="translate(${last[0]},${last[1]}) rotate(${ang*180/Math.PI})"/>`:'')}

// ---------- formations ----------
function block(cx,cz,rows,cols,dx,dz,fn){const out=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;out.push(fn(cx+(c-(cols-1)/2)*dx+(hash(i*3.1+cx)-.5)*0.25,cz+r*dz+(hash(i*7.7+cz)-.5)*0.25,i,r,c))}return out}

// ---------- scenes ----------
const S={};
function camAt(px,py,pz,tx,ty,tz){cam.position.set(px,py,pz);cam.lookAt(tx,ty,tz)}
function sky(col,fogNear,fogFar){scene.background=new THREE.Color(col);scene.fog.color.set(col);scene.fog.near=fogNear;scene.fog.far=fogFar}
function env({sea:s=false,isl=false,farmOn=true,groundOn=true}={}){sea.visible=s;island.visible=isl;farm.visible=farmOn;ground.visible=groundOn;trees.visible=groundOn}

 block(0,-14,3,16,1.3,-1.4,(x,z,i)=>({x,z,ry:0,team:'fr',hat:'shako',musket:'shoulder',walk:undefined})).forEach(figure);

 // foreground hero mannequins
 figure({x:-1.2,z:17.5,ry:Math.PI*0.95,team:'gb',hat:'shako',musket:'shoulder',headY:0.3});
 for(const [o,x,z] of [[0.2,-10,-16],[2.8,9,-17]]){const a=t-o;if(a>0&&a<.15)flashList.push([x,1.5,z+1,.6]);for(let j=0;j<5;j++)puff(x+j*.3,1.5,z+1,a-j*.05,1.2)}
 const tk=easeOut((t-0.3)/1.2);setText('title','WATERLOO',tk,(1-tk)*60);const sk=easeOut((t-1.0)/1.0);setText('sub','BÉLGICA · 1815',sk,(1-sk)*30);

S.cavalry=(t,d)=>{
 sky(0xb8b2a3,20,120);env();farm.position.set(-20,hgt(-20,-12),-12);sun.position.set(-20,25,-10);sun.intensity=2.3;hemi.intensity=1.0;
 const k=t/d;const cx=0,cz=0;
 camAt(Math.cos(k*1.3+0.4)*17,7+k*2,Math.sin(k*1.3+0.4)*17,0,0.8,0);
 // British hollow square
 const n=7,sp=1.1;for(let side=0;side<4;side++)for(let i=0;i<n;i++)for(let r=0;r<2;r++){const off=(i-(n-1)/2)*sp,dist=(n*sp)/2+r*1.0;const a=side*Math.PI/2;
  const x=cx+Math.cos(a)*dist-Math.sin(a)*off,z=cz+Math.sin(a)*dist+Math.cos(a)*off;
  figure({x,z,ry:Math.PI/2-a,team:'gb',hat:'shako',musket:'aim',kneel:r===0});
  if(r===1&&hash(side*31+i)<0.35){const ft=(t*1.3+hash(i+side))%1.7;if(ft<0.1)flashList.push([x+Math.cos(a)*1.2,1.5,z+Math.sin(a)*1.2,.25]);puff(x+Math.cos(a)*1.3,1.4,z+Math.sin(a)*1.3,ft,.5)}}

};

 sky(0xc4a882,40,190);env();farm.position.set(-30,hgt(-30,30),30);sun.position.set(-40,14,-10);sun.intensity=2.4;hemi.intensity=.9;
 const k=ease(t/d);camAt(lerp(1,0,k),lerp(50,44,k),lerp(20,17,k),1,0,-1);
 block(-3,-9,4,10,1.3,-1.4,(x,z,i)=>({x,z:z+Math.min(t,2)*1.0,ry:0,team:'fr',hat:'shako',musket:'port',walk:t*5+i,amp:.4})).forEach(figure);

 labels([{t:'PRUSIANOS',p:[Math.min(6,16-pin*10),3,-2.5],c:'#9aa0aa',op:easeOut((t-0.4)/0.6)},{t:'FRANCIA',p:[-3,3,-15],c:'#4a6fd8',op:easeOut((t-0.9)/0.6)},{t:'ALIADOS',p:[-3,3,12.5],c:'#d8443a',op:easeOut((t-1.2)/0.6)}]);
 for(let j=0;j<10;j++){const x=4+hash(j)*3,z=-8+hash(j+2)*4,a=t-0.8-hash(j+5)*1.5;if(a>0&&a<.1)flashList.push([x,1.5,z,.4]);puff(x,1.2,z,a,.45)}

S.guard=(t,d)=>{
 sky(0x9a7d62,18,110);env();farm.position.set(18,hgt(18,-4),-4);sun.position.set(-30,10,-25);sun.intensity=2.6;hemi.intensity=.8;
 const turn=d*0.6;const k=t/d;
 const adv=Math.min(t,turn)*1.0,back=Math.max(0,t-turn)*1.8;
 camAt(lerp(3,1.5,k),lerp(5.2,6.4,k),lerp(10.5,11.5,k),0,0.6,-6);
 block(0,-8,6,8,1.15,-1.15,(x,z,i)=>{const fleeing=t>turn+hash(i)*0.6;const lz=z+adv-(fleeing?back:0);const rot=fleeing?Math.min(1,(t-turn-hash(i)*0.6)*3):0;

 for(const o of [0.38,0.43,0.47]){const a=t-d*o;for(let i=0;i<10;i++){const x=(i-4.5)*1.05;if(a>0&&a<.1)flashList.push([x,1.5,1.3,.3]);puff(x,1.5,1.2,a-i*0.02,.8)}}

// ---------- seek ----------
window.seek=(T)=>{
 const sc=TL.scenes.find(s=>T>=s.start&&T<s.end)||TL.scenes[TL.scenes.length-1];
 const t=T-sc.start,d=sc.end-sc.start;
 beginFrame();labels([]);arrow([],0);setRain(0,false);
 for(const id of ['title','sub','tag'])setText(id,'',0);$('title').style.fontSize='150px';$('clock').style.opacity=0;
 S[sc.id](t,d);
 endFrame();flushSmoke();sun.target.position.set(cam.position.x*0.3,0,cam.position.z*0.3-5);sun.position.add(sun.target.position);
 // captions
 const c=sc.captions.find(c=>T>=c.a&&T<c.b+0.15);let html='';
 if(c){const pop=spring(clamp01((T-c.a)/0.25));html=c.text.replace(/(\d{3,4}|Napoleón|Wellington|Blücher|Waterloo|Elba|Santa Elena|Guardia Imperial|británicos|prusianos)/gi,'<b>$1</b>');$('cap').style.transform=`scale(${0.85+0.15*pop})`}
 if($('cap')._t!==html){$('cap').innerHTML=html;$('cap')._t=html}
 // fades between scenes
 const fin=clamp01(1-t/0.25),fout=clamp01(1-(d-t)/0.2);
 $('fade').style.opacity=Math.max(T<0.2?1-T/0.2:fin*0.9,sc===TL.scenes[TL.scenes.length-1]?clamp01((T-(TL.total-0.8))/0.8):fout*0.9);
 grain(Math.floor(T*30));
 renderer.render(scene,cam);
};
