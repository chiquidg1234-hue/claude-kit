<div id="labels"></div>
<div id="clock"><i id="hh" style="width:14px;height:62px;margin-left:-7px"></i><i id="mh" style="width:9px;height:92px;margin-left:-4.5px"></i></div>

<script type="module">

const $ = id => document.getElementById(id);

  let d = `M${P[0][0]},${P[0][1]}`; for (let i = 1; i < P.length; i++) d += ` L${P[i][0]},${P[i][1]}`; const L = P[P.length - 1], Pv = P[P.length - 2]; const ang = Math.atan2(L[1] - Pv[1], L[0] - Pv[0]);

window.seek = (T) => {
  const i = Math.max(0, shots.findIndex((s, k) => T >= s.at && T < s.end)); const s = shots[i === -1 ? shots.length - 1 : i]; const t = T - s.at, d = s.d;
  E.begin(); const L = Object.assign({}, LOOK[s.look]); E.look(L);
  const R = s.fn(t, d, T, L) || {};
  E.end();
  // transiciones: whip = desenfoque direccional ±0.12 s alrededor del corte; flash = blanco; smash = destello corto
  let whip = 0, flash = R.flash || 0;
  const nx = shots[i + 1];
  if (s.trans === 'whip') whip = Math.max(whip, 1 - t / 0.12);
  if (nx && nx.trans === 'whip') whip = Math.max(whip, 1 - (s.end - T) / 0.12);
  if (s.trans === 'flash') flash = Math.max(flash, (1 - t / 0.25) * .9);
  if (s.trans === 'smash') flash = Math.max(flash, (1 - t / 0.08) * .6);
  E.render(T, { whipX: 0.09 * Math.max(0, whip) * (i % 2 ? 1 : -1), flash: Math.max(0, flash), fade: T > WORDS.total - 0.05 ? 1 : 0, bloom: .38 });

  $('title').style.fontSize = '170px';
  for (const ti of TITLES) { if (T < ti.a || T >= ti.b) continue; const k = T - ti.a;
    if (ti.id === 'big') { setText('big', ti.text, 1, 0, 0.6 + 0.4 * spring(clamp01(k / .35), 1.2)); if (ti.sub && T >= ti.subA) setText('bigsub', ti.sub, easeOut((T - ti.subA) / .2), (1 - easeOut((T - ti.subA) / .25)) * 30); }

  // VS final

    if (!vs._on) { vs.innerHTML = `<div class="q">${CTA.question}</div><div class="chips">${CTA.options.map(o => `<div class="chip" style="background:${o.color}">${o.text}</div>`).join('')}</div><div class="cm">${CTA.comment}</div>`; vs._on = 1; }
    vs.style.opacity = 1; vs.children[0].style.transform = `scale(${.6 + .4 * spring(clamp01(k / .4))})`;
    CTA.options.forEach((o, n) => { const c = vs.children[1].children[n], ko = T - o.at; c.style.opacity = easeOut(ko / .2); c.style.transform = `scale(${.6 + .4 * spring(clamp01(ko / .4))})`; });
    vs.children[2].style.opacity = easeOut((T - CTA.commentAt) / .3); }

  const hideCap = R.vs || TITLES.some(ti => ti.hideCaptions && T >= ti.a && T < ti.b);
  if (ph && !hideCap) { const key = ph.a; if (cap._k !== key) { cap.innerHTML = ph.map(w => `<span>${w.w.replace(/"/g, '')}</span>`).join(''); cap._k = key; }
    ph.forEach((w, j) => { const sp = cap.children[j]; const on = T >= w.a; const k = clamp01((T - w.a) / .18); sp.className = on && ((j === ph.length - 1 ? T < w.b + .3 : T < ph[j + 1].a) || (KEY && KEY.test(w.w.replace(/["“]/g, '')))) ? 'on' : ''; sp.style.transform = `scale(${on ? .9 + .1 * spring(k) + (T < w.b ? .06 : 0) : .9})`; sp.style.opacity = on ? 1 : .35; });
    cap.style.opacity = 1; } else { cap.style.opacity = 0; cap._k = null; }

window.ready = true;
